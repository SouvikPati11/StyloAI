# Builds a signed Android App Bundle (for Play) and an APK on a version tag or
# manual dispatch, and uploads them as artifacts. Signing credentials come from
# GitHub Actions secrets — never committed. See docs/CICD.md.
name: android_release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build signed AAB + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add it to build a signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle (AAB)
        run: >
          flutter build appbundle --release
          --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          --dart-define=FLAVOR=prod

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          --dart-define=FLAVOR=prod

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: styloai-release
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Optional: publish to the Play internal track once you add the service
      # account secret. Uncomment and set PLAY_SERVICE_ACCOUNT_JSON.
      # - name: Upload to Play internal track
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: app.stylo.styloai
      #     releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
      #     track: internal
