# Builds a signed Android App Bundle (for Play) and an APK on a version tag or
# manual dispatch, and uploads them as artifacts. Signing credentials come from
# GitHub Actions secrets — never committed. See docs/CICD.md.
name: android_release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build signed AAB + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add it to build a signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      # ┌──────────────────────────────────────────────────────────────────┐
      # │ TEMPORARY DIAGNOSTIC — REMOVE THIS STEP AFTER COPYING THE VALUES. │
      # └──────────────────────────────────────────────────────────────────┘
      # Prints ONLY the SHA-1 and SHA-256 fingerprints of the release signing
      # certificate, read from the SAME keystore this workflow uses to sign the
      # AAB/APK. It does NOT print the store password, the keystore contents, the
      # private key, the alias, or any other credential, and it does NOT change
      # how the release is signed. keytool reads the password from an env var
      # (never echoed); every other line of its output is discarded. Delete this
      # step once the two fingerprints have been copied from the Actions log.
      - name: "TEMP: print release cert SHA-1/SHA-256 (remove after copying)"
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set +x  # never trace the command line (would contain -storepass)
          # -storepass is taken from $STORE_PASSWORD (masked by Actions, not
          # echoed). Keep only the two fingerprint lines; discard everything
          # else so no other certificate detail is emitted.
          fingerprints="$(keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" 2>/dev/null \
            | grep -E 'SHA(1|256):' | sed -E 's/^[[:space:]]*//')"
          if [ -z "$fingerprints" ]; then
            echo "::error::Could not read fingerprints from the release keystore."
            exit 1
          fi
          echo "----- Release signing certificate fingerprints -----"
          echo "$fingerprints"
          echo "----------------------------------------------------"

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # The permanent production API is https://api.souvikpati.in and nothing
      # else. Fail the release if PROD_API_BASE_URL is empty, is not HTTPS, is
      # not the expected host, or points at a raw IP (the old EC2 IPs must never
      # ship in a release). Only scheme/host are printed; the secret is never
      # echoed. This enforces Part 1/12: no IP, no cleartext, no fallback.
      - name: Validate release API base URL (no secret printed)
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          EXPECTED_HOST: "api.souvikpati.in"
        run: |
          if [ -z "$PROD_API_BASE_URL" ]; then
            echo "::error::PROD_API_BASE_URL secret is EMPTY. Set it to https://api.souvikpati.in in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          scheme="${PROD_API_BASE_URL%%://*}"
          rest="${PROD_API_BASE_URL#*://}"; host="${rest%%/*}"; host="${host%%:*}"
          echo "Release API base: scheme=$scheme host=$host"
          if [ "$scheme" != "https" ]; then
            echo "::error::Production API must be HTTPS (got scheme=$scheme). Expected https://$EXPECTED_HOST."; exit 1
          fi
          if [ "$host" != "$EXPECTED_HOST" ]; then
            echo "::error::Production API host must be $EXPECTED_HOST (got $host). Do not ship a raw IP or any other host."; exit 1
          fi
          case "$host" in
            *[0-9].[0-9]*[0-9].[0-9]*[0-9].[0-9]*) echo "::error::API host looks like a raw IP ($host); the permanent endpoint is https://$EXPECTED_HOST."; exit 1 ;;
          esac
          echo "OK: release targets https://$EXPECTED_HOST (no IP, no cleartext)."

      - name: Build App Bundle (AAB)
        run: >
          flutter build appbundle --release
          --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          --dart-define=FLAVOR=prod

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          --dart-define=FLAVOR=prod

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: styloai-release
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Optional: publish to the Play internal track once you add the service
      # account secret. Uncomment and set PLAY_SERVICE_ACCOUNT_JSON.
      # - name: Upload to Play internal track
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: app.stylo.styloai
      #     releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
      #     track: internal
