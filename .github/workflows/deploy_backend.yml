name: deploy_backend

on:
  workflow_dispatch:
  push:
    branches:
      - claude/happy-cori-w42sa5

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC: GitHub mints a short-lived token; AWS STS exchanges it for role
      # credentials IF the role's trust policy matches this token's claims.
      # For this workflow the token's `sub` claim is:
      #   repo:SouvikPati11/StyloAI:ref:refs/heads/claude/happy-cori-w42sa5
      # and its `aud` claim is `sts.amazonaws.com` (set explicitly below).
      # The IAM role StyloAI-GitHub-Deploy trust policy must allow that exact
      # sub (or repo:SouvikPati11/StyloAI:*) and that aud, on the provider
      # token.actions.githubusercontent.com. A mismatch is what produces
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity".
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      # Bridge GitHub Actions secrets to the EC2 instance WITHOUT putting any
      # secret into the SSM command document (which is retained in SSM history):
      # each value is stored as an encrypted SSM Parameter Store SecureString.
      # GitHub masks these values in logs, and they are never echoed.
      - name: Publish secrets to SSM Parameter Store (SecureString)
        env:
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional first-admin bootstrap. Set these as GitHub Actions secrets to
          # create/rotate the initial admin panel account. Never printed.
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          ADMIN_BOOTSTRAP_RESET: ${{ secrets.ADMIN_BOOTSTRAP_RESET }}
        run: |
          set -euo pipefail
          put() {
            # $1 = param name, $2 = value (read from env; never printed)
            aws ssm put-parameter \
              --region ap-south-1 \
              --name "/styloai/prod/$1" \
              --type SecureString \
              --overwrite \
              --value "$2" >/dev/null
            echo "stored /styloai/prod/$1"
          }
          # The backend verifies Google/Firebase ID tokens with the Admin SDK,
          # which requires the service-account JSON. Without it, every real
          # POST /v1/auth/google returns 401 (the empty-body 400 probe never
          # reaches verifyIdToken). Fail loudly so this is never silently broken.
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is empty. Add the Firebase service-account JSON for project lifereset-556c7 as a GitHub Actions secret (compact single-line JSON). The backend cannot verify Google Sign-In tokens without it."
            exit 1
          fi
          put RDS_HOST              "$RDS_HOST"
          put RDS_PASSWORD          "$RDS_PASSWORD"
          put REDIS_URL            "$REDIS_URL"
          put JWT_ACCESS_SECRET    "$JWT_ACCESS_SECRET"
          put JWT_REFRESH_SECRET   "$JWT_REFRESH_SECRET"
          put FIREBASE_PROJECT_ID  "$FIREBASE_PROJECT_ID"
          put FIREBASE_SERVICE_ACCOUNT_JSON "$FIREBASE_SERVICE_ACCOUNT_JSON"
          put GEMINI_API_KEY       "$GEMINI_API_KEY"
          # Admin bootstrap params are OPTIONAL — only published when provided, so
          # the deploy works with or without them. Stored as SecureString.
          if [ -n "${ADMIN_BOOTSTRAP_EMAIL:-}" ] && [ -n "${ADMIN_BOOTSTRAP_PASSWORD:-}" ]; then
            put ADMIN_BOOTSTRAP_EMAIL    "$ADMIN_BOOTSTRAP_EMAIL"
            put ADMIN_BOOTSTRAP_PASSWORD "$ADMIN_BOOTSTRAP_PASSWORD"
            put ADMIN_BOOTSTRAP_RESET    "${ADMIN_BOOTSTRAP_RESET:-false}"
            echo "admin bootstrap params provided — will ensure the first admin on the instance"
          else
            echo "admin bootstrap params not set — skipping (no admin will be created this run)"
          fi

      # Run the deployment on the instance via SSM, then WAIT for it, check the
      # final status, surface non-secret output, and fail the job on error.
      # The remote script contains NO secrets — it reads them from Parameter
      # Store with --with-decryption and writes them to a chmod 600 .env owned
      # by ec2-user. It never echoes secret values.
      - name: Deploy on EC2 via SSM (wait + fail on error)
        env:
          INSTANCE_ID: i-03d7204a2d92df8ac
          AWS_REGION: ap-south-1
        run: |
          set -euo pipefail

          cat > deploy-command.sh <<'EOF'
          set -euo pipefail
          # The SSM shell has no HOME/USER; git (and other tools) need them.
          export HOME=/home/ec2-user
          export USER=ec2-user
          # Strictly non-interactive: nothing may wait for stdin (SSM has none),
          # or the command would hang forever and stay "InProgress".
          export CI=true
          export NPM_CONFIG_YES=true
          export DEBIAN_FRONTEND=noninteractive
          # git must never prompt for credentials — fail fast instead of hanging.
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/usr/bin/true
          # Prisma network hygiene. `prisma generate` makes a best-effort call
          # to checkpoint.prisma.io (version check / telemetry); on a host with
          # slow or restricted outbound egress that call has no short timeout and
          # can stall generate for minutes. Disabling it removes the observed
          # hang. (This does NOT disable engine downloads or code generation.)
          export CHECKPOINT_DISABLE=1
          export PRISMA_HIDE_UPDATE_MESSAGE=1
          REGION=ap-south-1
          PARAM_PATH=/styloai/prod
          APP_DIR=/home/ec2-user/StyloAI/backend

          # Run all deployment commands from the backend dir as the ec2-user home.
          cd "$APP_DIR"
          git config --global --add safe.directory /home/ec2-user/StyloAI
          # GIT_TERMINAL_PROMPT=0 stops any interactive auth prompt and `timeout`
          # is the hard backstop, so a private-repo auth prompt can never block
          # the deployment. Any existing working credential (SSH key / stored
          # token) is left intact and still succeeds.
          timeout 180 git fetch origin claude/happy-cori-w42sa5
          git checkout claude/happy-cori-w42sa5
          git reset --hard origin/claude/happy-cori-w42sa5

          getp() {
            aws ssm get-parameter --name "$PARAM_PATH/$1" --with-decryption \
              --query Parameter.Value --output text --region "$REGION"
          }
          # Optional getter: returns empty (never fails the deploy) when a
          # parameter is not present — used for the optional admin bootstrap.
          getp_opt() {
            aws ssm get-parameter --name "$PARAM_PATH/$1" --with-decryption \
              --query Parameter.Value --output text --region "$REGION" 2>/dev/null || true
          }
          RDS_HOST_VAL=$(getp RDS_HOST)
          RDS_PASSWORD_VAL=$(getp RDS_PASSWORD)
          REDIS_URL_VAL=$(getp REDIS_URL)
          JWT_ACCESS_SECRET_VAL=$(getp JWT_ACCESS_SECRET)
          JWT_REFRESH_SECRET_VAL=$(getp JWT_REFRESH_SECRET)
          FIREBASE_PROJECT_ID_VAL=$(getp FIREBASE_PROJECT_ID)
          FIREBASE_SERVICE_ACCOUNT_JSON_VAL=$(getp FIREBASE_SERVICE_ACCOUNT_JSON)
          GEMINI_API_KEY_VAL=$(getp GEMINI_API_KEY)

          # Written by redirection (values are never echoed to stdout).
          cat > .env <<ENVFILE
          NODE_ENV=production
          PORT=3000
          # Bind to loopback only: the app is reached exclusively through the
          # Nginx TLS reverse proxy on 127.0.0.1:3000, never publicly on :3000.
          BIND_ADDRESS=127.0.0.1
          # The public API is the permanent HTTPS domain, not the EC2 IP.
          API_BASE_URL=https://api.souvikpati.in
          ADMIN_BASE_URL=https://api.souvikpati.in/admin

          DATABASE_URL=postgresql://styloai_admin:${RDS_PASSWORD_VAL}@${RDS_HOST_VAL}:5432/styloai?sslmode=require
          REDIS_URL=${REDIS_URL_VAL}

          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET_VAL}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET_VAL}
          JWT_ACCESS_TTL=3600
          JWT_REFRESH_TTL=2592000

          FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID_VAL}
          GEMINI_API_KEY=${GEMINI_API_KEY_VAL}
          GEMINI_MODEL=gemini-2.0-flash-preview-image-generation
          GEMINI_TIMEOUT_MS=60000

          AWS_REGION=ap-south-1
          S3_BUCKET=styloai-prod-assets-2026
          S3_UPLOAD_URL_TTL=300

          CORS_ALLOWED_ORIGINS=*
          ENVFILE

          # The Firebase service-account JSON is written on its own line, OUTSIDE
          # the heredoc (its braces/quotes must not be shell-expanded), and
          # single-quoted so dotenv treats the whole compact JSON as one value
          # (escaped \n in the private key stays literal for JSON.parse). The
          # value is written straight to .env — never echoed to stdout.
          printf "FIREBASE_SERVICE_ACCOUNT_JSON='%s'\n" \
            "$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON_VAL" | tr -d '\n\r')" >> .env

          # Each step is time-bounded so no build/install/DB step can hang the
          # deployment. devDeps are required (prisma + nest CLI); local binaries
          # are called directly so `npx` can never prompt to install.
          echo "[deploy] node=$(node -v) npm=$(npm -v)"

          # Install deps WITHOUT the implicit @prisma/client postinstall
          # (`prisma generate`). That implicit generate is what hung inside
          # `npm ci`: every package finished downloading, then generate stalled
          # until the 600s timeout killed the whole install (exit 124). We run
          # generate on its own, separately-bounded line below, so an install
          # can never again be taken down by generate — and a generate stall is
          # isolated and clearly attributable.
          echo "[deploy] npm ci (skip prisma postinstall generate)…"
          PRISMA_SKIP_POSTINSTALL_GENERATE=true \
            timeout 600 npm ci --include=dev --no-audit --no-fund

          echo "[deploy] prisma generate…"
          timeout 300 ./node_modules/.bin/prisma generate
          echo "[deploy] prisma migrate deploy…"
          timeout 180 ./node_modules/.bin/prisma migrate deploy

          # First-admin bootstrap (idempotent). Only runs when the optional
          # ADMIN_BOOTSTRAP_* SecureString params are present; the script creates
          # the admin if missing, leaves an existing one untouched (unless RESET),
          # and NEVER prints the password. DATABASE_URL is passed inline (from the
          # same RDS values used for .env); nothing sensitive is echoed.
          ADMIN_BOOTSTRAP_EMAIL_VAL=$(getp_opt ADMIN_BOOTSTRAP_EMAIL)
          ADMIN_BOOTSTRAP_PASSWORD_VAL=$(getp_opt ADMIN_BOOTSTRAP_PASSWORD)
          ADMIN_BOOTSTRAP_RESET_VAL=$(getp_opt ADMIN_BOOTSTRAP_RESET)
          if [ -n "$ADMIN_BOOTSTRAP_EMAIL_VAL" ] && [ -n "$ADMIN_BOOTSTRAP_PASSWORD_VAL" ]; then
            echo "[deploy] ensuring first admin account…"
            DATABASE_URL="postgresql://styloai_admin:${RDS_PASSWORD_VAL}@${RDS_HOST_VAL}:5432/styloai?sslmode=require" \
            ADMIN_BOOTSTRAP_EMAIL="$ADMIN_BOOTSTRAP_EMAIL_VAL" \
            ADMIN_BOOTSTRAP_PASSWORD="$ADMIN_BOOTSTRAP_PASSWORD_VAL" \
            ADMIN_BOOTSTRAP_RESET="$ADMIN_BOOTSTRAP_RESET_VAL" \
              timeout 120 ./node_modules/.bin/ts-node prisma/bootstrap-admin.ts
          else
            echo "[deploy] no admin bootstrap params — skipping first-admin creation."
          fi

          echo "[deploy] nest build…"
          timeout 420 npm run build

          # Ensure the runtime user owns what it needs; keep .env private.
          chown -R ec2-user:ec2-user /home/ec2-user/StyloAI
          chmod 600 "$APP_DIR/.env"

          # Install/refresh the systemd unit (entry point: dist/src/main.js).
          install -m 644 "$APP_DIR/deploy/styloai-backend.service" \
            /etc/systemd/system/styloai-backend.service
          systemctl daemon-reload
          systemctl enable styloai-backend
          systemctl restart styloai-backend

          sleep 5
          if ! systemctl is-active --quiet styloai-backend; then
            echo "styloai-backend failed to start; recent logs:"
            journalctl -u styloai-backend -n 30 --no-pager || true
            exit 1
          fi
          echo "styloai-backend is active."

          # Prove the app actually serves traffic — not merely that the process
          # started. Probe the health endpoint on loopback (bounded retries for
          # a brief startup race) and confirm the port is listening. Non-secret.
          echo "[deploy] health check http://127.0.0.1:3000/v1/health …"
          HEALTH_OK=0
          for _ in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/styloai_health.out -w '%{http_code}' \
              --max-time 5 http://127.0.0.1:3000/v1/health || echo 000)
            if [ "$CODE" = "200" ]; then
              HEALTH_OK=1
              echo "health HTTP 200: $(cat /tmp/styloai_health.out)"
              break
            fi
            sleep 2
          done
          echo "[deploy] listening sockets on :3000:"
          (ss -ltnp 2>/dev/null | grep ':3000 ' \
            || ss -ltn 2>/dev/null | grep ':3000 ' \
            || echo "(:3000 not shown by ss)")
          if [ "$HEALTH_OK" != "1" ]; then
            echo "health check failed after retries; recent logs:"
            journalctl -u styloai-backend -n 40 --no-pager || true
            exit 1
          fi
          echo "styloai-backend is active and healthy on 127.0.0.1:3000."
          # Note: FirebaseService now HARD-FAILS boot in production if the service
          # account is missing/invalid, so an unconfigured backend can never reach
          # this point (it crash-loops and the is-active check above fails). The
          # definitive, runtime token-verification proof runs from the CI runner
          # after Nginx is up (see the "Verify Firebase Admin" step in the job).

          # ============ Nginx TLS reverse proxy for api.souvikpati.in ========
          # Permanent edge: https://api.souvikpati.in -> 127.0.0.1:3000 (NestJS).
          # DNS already resolves to this instance and a Let's Encrypt certificate
          # already exists; the earlier fault was that nginx was not running.
          # Write a known-good config for OUR domain only (this box hosts no other
          # user sites), validate it, and start nginx. Idempotent.
          DOMAIN=api.souvikpati.in
          CERT_DIR=/etc/letsencrypt/live/$DOMAIN
          echo "[nginx] before: active=$(systemctl is-active nginx 2>/dev/null || echo none) cert=$([ -f "$CERT_DIR/fullchain.pem" ] && echo present || echo absent)"
          mkdir -p /var/www/certbot

          # Obtain a certificate only if one does not already exist (avoid LE
          # rate limits). Needs public :80 + DNS, both already in place.
          if [ ! -f "$CERT_DIR/fullchain.pem" ]; then
            echo "[nginx] no certificate — requesting via certbot webroot…"
            printf '%s\n' 'server {' 'listen 80;' 'server_name api.souvikpati.in;' 'location /.well-known/acme-challenge/ { root /var/www/certbot; }' 'location / { return 404; }' '}' > /etc/nginx/conf.d/styloai-api.conf
            nginx -t && { systemctl enable --now nginx; systemctl reload nginx; } || true
            timeout 150 certbot certonly --webroot -w /var/www/certbot -d "$DOMAIN" \
              --non-interactive --agree-tos --register-unsafely-without-email \
              || echo "::warning::certbot issuance failed — check DNS->this host and Security Group port 80."
          fi

          echo "[nginx] writing permanent reverse-proxy config…"
          cat > /etc/nginx/conf.d/styloai-api.conf <<'NGINX'
          server {
          listen 80;
          listen [::]:80;
          server_name api.souvikpati.in;
          location /.well-known/acme-challenge/ { root /var/www/certbot; }
          location / { return 301 https://$host$request_uri; }
          }
          server {
          listen 443 ssl;
          listen [::]:443 ssl;
          http2 on;
          server_name api.souvikpati.in;
          ssl_certificate     /etc/letsencrypt/live/api.souvikpati.in/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/api.souvikpati.in/privkey.pem;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers on;
          client_max_body_size 25m;
          location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 90s;
          }
          }
          NGINX

          echo "[nginx] validating config…"
          if ! nginx -t; then
            echo "::error::nginx -t failed"; sed 's/^/[nginx.conf] /' /etc/nginx/conf.d/styloai-api.conf
            journalctl -u nginx -n 30 --no-pager || true
            exit 1
          fi
          systemctl enable --now nginx
          systemctl reload nginx || systemctl restart nginx
          sleep 2
          if ! systemctl is-active --quiet nginx; then
            echo "::error::nginx not active after start"; journalctl -u nginx -n 40 --no-pager || true
            exit 1
          fi
          echo "[nginx] active. listening:"; ss -lntp 2>/dev/null | grep -E ':80 |:443 |:3000 ' || true

          # Ensure automatic renewal (create a systemd timer if none exists).
          if ! systemctl is-enabled --quiet certbot-renew.timer 2>/dev/null \
             && ! systemctl is-enabled --quiet certbot.timer 2>/dev/null \
             && ! systemctl is-enabled --quiet styloai-certbot-renew.timer 2>/dev/null; then
            echo "[nginx] installing certbot auto-renew systemd timer…"
            CB=$(command -v certbot || echo /usr/bin/certbot)
            printf '%s\n' '[Unit]' 'Description=StyloAI certbot renewal' '[Service]' 'Type=oneshot' "ExecStart=$CB renew --quiet --deploy-hook \"systemctl reload nginx\"" > /etc/systemd/system/styloai-certbot-renew.service
            printf '%s\n' '[Unit]' 'Description=StyloAI certbot renewal (twice daily)' '[Timer]' 'OnCalendar=*-*-* 03,15:00:00' 'RandomizedDelaySec=1h' 'Persistent=true' '[Install]' 'WantedBy=timers.target' > /etc/systemd/system/styloai-certbot-renew.timer
            systemctl daemon-reload
            systemctl enable --now styloai-certbot-renew.timer
          fi
          echo "[verify] renew timer: $(systemctl is-enabled certbot-renew.timer 2>/dev/null || systemctl is-enabled styloai-certbot-renew.timer 2>/dev/null || echo none)"

          # Verify TLS + proxy locally (cert CN + SNI via --resolve to loopback).
          echo "[verify] local TLS https://$DOMAIN/v1/health …"
          VCODE=$(curl -s -o /tmp/vh.out -w '%{http_code}' --max-time 12 \
            --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/v1/health" || echo 000)
          echo "[verify] local https code=$VCODE body=$(cat /tmp/vh.out 2>/dev/null || true)"
          if [ "$VCODE" != "200" ]; then
            echo "::error::Nginx->NestJS TLS proxy did not return 200 locally"; exit 1
          fi
          if timeout 150 certbot renew --dry-run >/tmp/renew.out 2>&1; then
            echo "[verify] certbot renew --dry-run: OK"
          else
            echo "::warning::certbot renew --dry-run failed:"; tail -4 /tmp/renew.out 2>/dev/null || true
          fi

          echo "Deployment succeeded; API is live behind Nginx TLS at https://$DOMAIN."
          EOF

          # Do not stack deployments: cancel any StyloAI deployment command still
          # in flight on this instance (e.g. a previous hung run) before starting.
          for st in Pending InProgress Delayed; do
            STALE=$(aws ssm list-commands --region "$AWS_REGION" \
              --instance-id "$INSTANCE_ID" --filters "key=Status,value=$st" \
              --query "Commands[?Comment=='StyloAI backend deployment'].CommandId" \
              --output text 2>/dev/null || true)
            for c in $STALE; do
              echo "Cancelling stale in-flight deployment command ($st): $c"
              aws ssm cancel-command --region "$AWS_REGION" --command-id "$c" || true
            done
          done

          # Send the command (no secrets in the parameters) and capture its id.
          # executionTimeout is a hard backstop: SSM terminates the remote script
          # and marks the invocation terminal if it ever exceeds 25 minutes, so a
          # hang can never stay "InProgress" indefinitely.
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "StyloAI backend deployment" \
            --parameters "$(jq -n --rawfile s deploy-command.sh \
              '{commands: [$s], executionTimeout: ["1500"]}')" \
            --query Command.CommandId --output text)
          echo "SSM CommandId: $CMD_ID"

          # Poll until the command reaches a terminal state. Budget (~30 min) sits
          # just above the SSM executionTimeout so we wait for SSM's own verdict
          # rather than pre-empting a legitimately long (but bounded) deploy. A
          # genuinely hung step is failed far sooner by its per-step `timeout`.
          STATUS="Pending"
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 15 ;;
            esac
          done

          # If the budget elapsed while still non-terminal, cancel so nothing
          # lingers on the instance, then treat it as a failure.
          case "$STATUS" in
            Pending|InProgress|Delayed)
              echo "Command still '$STATUS' after the poll budget; cancelling."
              aws ssm cancel-command --region "$AWS_REGION" --command-id "$CMD_ID" || true
              STATUS="TimedOut(waiting)"
              ;;
          esac

          echo "Final SSM status: $STATUS"
          DETAILS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StatusDetails --output text 2>/dev/null || true)
          echo "Status details: ${DETAILS:-n/a}"
          echo "----- remote output (non-secret) -----"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text 2>/dev/null || true

          if [ "$STATUS" != "Success" ]; then
            echo "----- remote errors -----"
            aws ssm get-command-invocation \
              --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text 2>/dev/null || true
            echo "::error::Backend deployment failed (SSM status: $STATUS)"
            exit 1
          fi
          echo "Backend deployment completed successfully."

      # Permanent public edge is 443 (Nginx/TLS); 3000 must not be public. Ensure
      # the instance's Security Group allows 80/443 and drop any public 3000 rule.
      # Best-effort: needs ec2 permissions on the deploy role; never fails the job
      # (the external HTTPS check below is the real gate).
      - name: Ensure Security Group allows 80/443 (best-effort)
        env:
          AWS_REGION: ap-south-1
          INSTANCE_ID: i-03d7204a2d92df8ac
        run: |
          set +e
          SGS=$(aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[].Instances[].SecurityGroups[].GroupId' --output text 2>/tmp/sg.err)
          if [ -z "$SGS" ]; then
            echo "::warning::Could not read Security Groups (deploy role lacks ec2:DescribeInstances?). Ensure 80+443 are open to 0.0.0.0/0 and 3000 is NOT public. $(cat /tmp/sg.err 2>/dev/null)"
            exit 0
          fi
          echo "Instance Security Groups: $SGS"
          for sg in $SGS; do
            for port in 80 443; do
              aws ec2 authorize-security-group-ingress --region "$AWS_REGION" --group-id "$sg" \
                --protocol tcp --port "$port" --cidr 0.0.0.0/0 >/dev/null 2>&1 \
                && echo "opened tcp/$port on $sg" || echo "tcp/$port on $sg already open or not permitted"
            done
            aws ec2 revoke-security-group-ingress --region "$AWS_REGION" --group-id "$sg" \
              --protocol tcp --port 3000 --cidr 0.0.0.0/0 >/dev/null 2>&1 \
              && echo "revoked public tcp/3000 on $sg" || echo "no public tcp/3000 rule to revoke on $sg (or not permitted)"
          done
          exit 0

      # Authoritative external verification from the GitHub runner (real public
      # internet, not the instance). Fails the deploy if the permanent public
      # HTTPS API is not healthy — no secrets printed.
      - name: Verify public HTTPS endpoint https://api.souvikpati.in
        run: |
          set -e
          url="https://api.souvikpati.in/v1/health"
          echo "External GET $url"
          code=$(curl -s -o /tmp/pub.out -w '%{http_code}' --max-time 25 "$url" || echo 000)
          echo "public https status=$code body=$(cat /tmp/pub.out 2>/dev/null || true)"
          echo "----- TLS / headers -----"
          curl -sS -I --max-time 25 "$url" 2>&1 | sed -n '1,12p' || true
          if [ "$code" != "200" ]; then
            echo "::error::Public https://api.souvikpati.in/v1/health did not return 200 (got $code). Check Security Group 443 and Nginx."
            exit 1
          fi
          echo "Public HTTPS API is live and healthy."

      # Verify the admin panel (StyloAI Studio) is actually served. The static
      # root is resolved from the compiled module dir, so a wrong path serves
      # 404s silently — this fails the deploy if the SPA or its brand asset is
      # not reachable at /admin. No secrets involved (static files only).
      - name: Verify admin panel is served at /admin
        run: |
          set -e
          base="https://api.souvikpati.in/admin"
          idx=$(curl -s -o /tmp/admin.out -w '%{http_code}' --max-time 25 "$base/" || echo 000)
          echo "admin index status=$idx"
          if [ "$idx" != "200" ]; then
            echo "::error::Admin panel not served at $base/ (got $idx). Check ServeStaticModule rootPath."; exit 1
          fi
          if ! grep -qi 'StyloAI Studio' /tmp/admin.out; then
            echo "::error::/admin served but did not contain the StyloAI Studio shell."; exit 1
          fi
          logo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$base/logo.png" || echo 000)
          echo "admin logo status=$logo"
          if [ "$logo" != "200" ]; then
            echo "::error::Admin brand asset not served at $base/logo.png (got $logo)."; exit 1
          fi
          echo "OK: admin panel and brand asset are served at /admin."

      # Verify the bootstrap admin can actually log in — ONLY when the bootstrap
      # secrets are configured. Sends the login over TLS (exactly like the real
      # form) and prints ONLY the HTTP status: never the password, the access
      # token, or the response body. Skipped entirely when no bootstrap is set.
      - name: Verify admin login (only if bootstrap configured)
        env:
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_BOOTSTRAP_EMAIL:-}" ] || [ -z "${ADMIN_BOOTSTRAP_PASSWORD:-}" ]; then
            echo "No admin bootstrap secrets set — skipping admin login verification."
            exit 0
          fi
          url="https://api.souvikpati.in/v1/admin/auth/login"
          # Build the JSON body with jq so credentials are never interpolated into
          # a logged command line; write it to a temp file, POST, then shred it.
          jq -n --arg e "$ADMIN_BOOTSTRAP_EMAIL" --arg p "$ADMIN_BOOTSTRAP_PASSWORD" \
            '{email:$e,password:$p}' > /tmp/login.json
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            -H 'Content-Type: application/json' --data @/tmp/login.json "$url" || echo 000)
          shred -u /tmp/login.json 2>/dev/null || rm -f /tmp/login.json
          echo "admin login status=$code"
          if [ "$code" != "200" ]; then
            echo "::error::Admin login did not return 200 (got $code). The bootstrap admin may not exist or the password is wrong."; exit 1
          fi
          echo "OK: bootstrap admin can log in (200). Token/body intentionally not printed."

      # Verify the AI generation pipeline is ready (non-secret readiness probe).
      # Reports whether the image provider has credentials and the model in use,
      # and whether the Redis-backed job queue is reachable — the two things whose
      # absence silently breaks generation. No secret/API key is ever printed. A
      # missing provider key or unreachable queue is surfaced as a WARNING (not a
      # hard failure) so a content/infra gap is visible without blocking deploys.
      - name: Verify AI generation readiness (provider + queue)
        run: |
          set -e
          url="https://api.souvikpati.in/v1/gen-health"
          code=$(curl -s -o /tmp/gh.out -w '%{http_code}' --max-time 25 "$url" || echo 000)
          echo "gen-health http=$code body=$(cat /tmp/gh.out 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            echo "::warning::/v1/gen-health did not return 200 (got $code)."; exit 0
          fi
          if ! grep -q '"provider_configured":true' /tmp/gh.out; then
            echo "::warning::AI provider is NOT configured (no GEMINI_API_KEY). Outfit/Hair/Glasses generations will fail with not_configured until the key is set."
          fi
          if ! grep -q '"queue_reachable":true' /tmp/gh.out; then
            echo "::warning::Generation queue (Redis) is NOT reachable. Submitted generations will stay queued and never process — check REDIS_URL."
          fi
          echo "OK: generation readiness reported (see body above; provider key is never printed)."

      # Prove the /v1/auth/google ROUTE reaches NestJS through Nginx — not just
      # /health. A malformed (no Firebase token) request must get an APPLICATION
      # HTTP status (400/401/422), which proves the proxy + routing + validation
      # pipeline is live. A 000/timeout or 502/504 would mean the route is not
      # reachable. No real token is ever sent; nothing sensitive is printed.
      - name: Verify /v1/auth/google route reachability (no token)
        run: |
          set -e
          url="https://api.souvikpati.in/v1/auth/google"
          echo "External POST $url with an empty body (expect an app 4xx)"
          code=$(curl -s -o /tmp/ag.out -w '%{http_code}' --max-time 25 \
            -H 'Content-Type: application/json' -d '{}' "$url" || echo 000)
          echo "auth route status=$code body=$(head -c 200 /tmp/ag.out 2>/dev/null || true)"
          case "$code" in
            400|401|403|422)
              echo "OK: /v1/auth/google reaches NestJS (validation rejected the empty body with $code)." ;;
            000)
              echo "::error::/v1/auth/google unreachable (transport failure/timeout). Nginx or Security Group problem."; exit 1 ;;
            502|503|504)
              echo "::error::/v1/auth/google returned $code — Nginx cannot reach NestJS (127.0.0.1:3000)."; exit 1 ;;
            *)
              echo "::warning::/v1/auth/google returned unexpected $code (route is reachable, but check the backend handler)." ;;
          esac

      # DEFINITIVE runtime proof that the backend can verify Firebase tokens.
      # (1) Non-secret readiness probe: Firebase Admin must be initialized and
      #     bound to project lifereset-556c7.
      - name: Verify Firebase Admin initialized (status + project)
        run: |
          set -e
          url="https://api.souvikpati.in/v1/auth/firebase-status"
          code=$(curl -s -o /tmp/fs.out -w '%{http_code}' --max-time 25 "$url" || echo 000)
          echo "firebase-status http=$code body=$(cat /tmp/fs.out 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            echo "::error::/v1/auth/firebase-status did not return 200 (got $code)."; exit 1
          fi
          if ! grep -q '"configured":true' /tmp/fs.out; then
            echo "::error::Firebase Admin is NOT initialized on the backend (configured=false). Google Sign-In will 401. Check FIREBASE_SERVICE_ACCOUNT_JSON."; exit 1
          fi
          if ! grep -q '"project_id":"lifereset-556c7"' /tmp/fs.out; then
            echo "::error::Firebase Admin is bound to the WRONG project (expected lifereset-556c7). The service account is for a different Firebase project."; exit 1
          fi
          echo "OK: Firebase Admin initialized for project lifereset-556c7."

      # (2) Real token-verification proof WITHOUT a valid Google token: an
      #     invalid but non-empty token must reach verifyIdToken and be rejected
      #     with 401 'Invalid Firebase ID token' (not the 'not configured' path,
      #     and not the empty-body 400). This proves the request actually reaches
      #     the Firebase Admin verification code. No real token is used.
      - name: Verify invalid Firebase token reaches verification (401)
        run: |
          set -e
          url="https://api.souvikpati.in/v1/auth/google"
          code=$(curl -s -o /tmp/it.out -w '%{http_code}' --max-time 25 \
            -H 'Content-Type: application/json' \
            -d '{"firebase_id_token":"invalid.notarealtoken.forverificationprobe"}' \
            "$url" || echo 000)
          echo "invalid-token http=$code body=$(head -c 200 /tmp/it.out 2>/dev/null || true)"
          if grep -qi 'not configured' /tmp/it.out; then
            echo "::error::Backend reports Firebase Admin not configured — verification code path is disabled."; exit 1
          fi
          if [ "$code" != "401" ]; then
            echo "::error::Expected HTTP 401 for an invalid Firebase token (got $code). If 400, the token never reached verifyIdToken; if 5xx, the handler errored."; exit 1
          fi
          if ! grep -qi 'Invalid Firebase ID token' /tmp/it.out; then
            echo "::error::401 returned but not from Firebase token verification (unexpected message). Check the auth handler."; exit 1
          fi
          echo "OK: invalid token reached Firebase Admin verification and was rejected with 401."
