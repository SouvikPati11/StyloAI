name: deploy_backend

on:
  workflow_dispatch:
  push:
    branches:
      - claude/happy-cori-w42sa5

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy through SSM
        env:
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > deploy-command.sh <<'EOF'
          set -e

          cd /home/ec2-user/StyloAI/backend

          git fetch origin claude/happy-cori-w42sa5
          git checkout claude/happy-cori-w42sa5
          git reset --hard origin/claude/happy-cori-w42sa5

          cat > .env <<ENVEOF
          NODE_ENV=production
          PORT=3000
          API_BASE_URL=http://13.235.73.14:3000
          ADMIN_BASE_URL=http://13.235.73.14:3000/admin

          DATABASE_URL=postgresql://styloai_admin:${RDS_PASSWORD}@${RDS_HOST}:5432/styloai?sslmode=require
          REDIS_URL=${REDIS_URL}

          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_ACCESS_TTL=3600
          JWT_REFRESH_TTL=2592000

          FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=gemini-2.0-flash-preview-image-generation
          GEMINI_TIMEOUT_MS=60000

          AWS_REGION=ap-south-1
          S3_BUCKET=styloai-prod-assets-2026
          S3_UPLOAD_URL_TTL=300

          CORS_ALLOWED_ORIGINS=*
          ENVEOF

          chmod 600 .env

          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

          sudo systemctl restart styloai-backend || true

          if ! systemctl is-active --quiet styloai-backend; then
            nohup npm run start:prod > /tmp/styloai-backend.log 2>&1 &
          fi
          EOF

          python3 - <<PY
          import os, base64
          data = open("deploy-command.sh", "rb").read()
          print(base64.b64encode(data).decode())
          PY

          COMMAND=$(python3 - <<PY
          import base64
          data = open("deploy-command.sh", "rb").read()
          print(base64.b64encode(data).decode())
          PY
          )

          aws ssm send-command \
            --instance-ids i-03d7204a2d92df8ac \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $COMMAND | base64 -d | bash\"]" \
            --comment "StyloAI backend deployment"
