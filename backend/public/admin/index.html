<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0E1626" />
<title>StyloAI Studio · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* StyloAI Studio — the admin console shares the mobile app's dark navy /
     champagne-gold / ivory identity (tokens mirror mobile/lib/design/tokens.dart
     dark palette). No purple/plum, no generic dashboard chrome. */
  :root {
    --bg: #0E1626;            /* navy canvas (bgDark) */
    --surface: #182136;       /* card (surfaceDark) */
    --surface-alt: #212B41;   /* raised (surfaceAltDark) */
    --line: #2A3247;          /* subtle border (lineDark) */
    --ink: #F5F0EC;           /* ivory text (inkDark) */
    --ink-soft: #C3BDB2;      /* secondary (inkSoftDark) */
    --muted: #8E9099;         /* tertiary (mutedDark) */
    --accent: #CBA867;        /* champagne gold (accentDark) */
    --accent-soft: #241E17;   /* gold wash (accentSoftDark) */
    --ok: #4CAF82; --warn: #D2A24C; --err: #E07A63;
    --radius: 16px; --radius-sm: 12px; --pill: 999px;
    --sidebar: 248px;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  .hidden { display: none !important; }
  .serif { font-family: 'Fraunces', Georgia, serif; }
  .muted { color: var(--muted); }
  .soft { color: var(--ink-soft); }
  .gold { color: var(--accent); }

  /* Wordmark */
  .wordmark { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -.02em; }
  .wordmark .ai { color: var(--accent); }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }

  /* Buttons */
  button { cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
    border: none; border-radius: var(--radius-sm); padding: 10px 16px;
    background: var(--accent); color: #1a1206; transition: filter .15s, transform .05s; }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  button.secondary { background: var(--surface-alt); color: var(--ink); border: 1px solid var(--line); }
  button.ghost { background: transparent; color: var(--ink-soft); padding: 8px 12px; border: 1px solid transparent; }
  button.ghost:hover { border-color: var(--line); filter: none; }
  button.danger { background: transparent; color: var(--err); border: 1px solid rgba(224,122,99,.4); }
  button.danger:hover { background: rgba(224,122,99,.1); filter: none; }
  button.icon { padding: 7px 10px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Inputs */
  label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 0 0 6px; font-weight: 500; }
  input, select, textarea {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: var(--radius-sm); font-size: 14px; background: var(--bg);
    color: var(--ink); font-family: inherit; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  select option { background: var(--surface); color: var(--ink); }
  input[type=file] { padding: 8px; }

  /* Login */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(1100px 600px at 70% -10%, #14203a 0%, var(--bg) 55%); }
  .login-card { width: 100%; max-width: 400px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 34px 30px; box-shadow: var(--shadow); }
  .login-card .brand { font-size: 26px; }
  .login-card .eyebrow { margin: 6px 0 22px; }

  /* App shell */
  #app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
  aside { background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .side-brand { padding: 20px 22px 16px; font-size: 21px; display:flex; align-items:center; gap: 10px; }
  .side-logo { width: 30px; height: 30px; border-radius: 9px; object-fit: cover; background: var(--surface-alt); }
  .side-nav { flex: 1; overflow-y: auto; padding: 6px 12px 12px; }
  .nav-group { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 16px 12px 6px; }
  .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: transparent; color: var(--ink-soft); border: none; border-radius: 10px;
    padding: 10px 12px; font-weight: 500; font-size: 14px; margin-bottom: 2px; }
  .nav-item:hover { background: var(--surface-alt); filter: none; color: var(--ink); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .ico { width: 18px; text-align: center; font-size: 15px; opacity: .9; }
  .side-foot { padding: 12px; border-top: 1px solid var(--line); }
  .side-foot .who { font-size: 12.5px; color: var(--muted); padding: 4px 12px 10px; word-break: break-all; }

  main { min-width: 0; }
  .topbar { display: none; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 8; }
  .content { max-width: 1080px; margin: 0 auto; padding: 30px 24px 90px; }
  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 27px; margin: 4px 0 0; letter-spacing: -.01em; }
  .page-head p { color: var(--muted); margin: 6px 0 0; font-size: 13.5px; }

  /* Cards & layout */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; box-shadow: 0 1px 0 rgba(255,255,255,.02); }
  .card + .card { margin-top: 16px; }
  .stat-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 16px; }
  .stat .n { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .stat .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-top: 6px; }
  .stat.accent .n { color: var(--accent); }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .row > div { flex: 1; min-width: 150px; }
  .row > div.tight { flex: 0 0 auto; min-width: 0; }
  .section-title { font-family:'Fraunces',serif; font-size: 18px; font-weight: 600; margin: 28px 0 14px; }
  .flex { display: flex; gap: 10px; align-items: center; }
  .spacer { flex: 1; }
  .wrap { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* Tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-alt); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,.015); }
  td .sub { color: var(--muted); font-size: 12px; }

  .pill { display:inline-block; padding: 3px 11px; border-radius: var(--pill); font-size: 11.5px; font-weight: 600; letter-spacing: .01em; }
  .pill.ok { background: rgba(76,175,130,.15); color: var(--ok); }
  .pill.warn { background: rgba(210,162,76,.15); color: var(--warn); }
  .pill.err { background: rgba(224,122,99,.15); color: var(--err); }
  .pill.neutral { background: var(--surface-alt); color: var(--ink-soft); }
  .thumb { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; background: var(--surface-alt); border: 1px solid var(--line); }

  .banner { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(203,168,103,.25);
    border-radius: var(--radius-sm); padding: 11px 15px; font-size: 13px; margin-bottom: 18px; }
  .err-text { color: var(--err); font-size: 13px; margin-top: 10px; min-height: 16px; }

  /* States */
  .state { text-align: center; padding: 46px 20px; color: var(--muted); }
  .state .ico { font-size: 30px; opacity: .5; }
  .state .t { color: var(--ink-soft); font-weight: 600; margin-top: 12px; }
  .state .s { font-size: 13px; margin-top: 5px; }
  .spinner { width: 26px; height: 26px; border-radius: 50%; border: 2.6px solid var(--line);
    border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Bars */
  .bar-row { display: grid; grid-template-columns: 110px 1fr 44px; align-items: center; gap: 12px; margin: 9px 0; }
  .bar-track { background: var(--surface-alt); border-radius: var(--pill); height: 9px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #e0c187); border-radius: var(--pill); }

  /* Toast */
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--bg); padding: 11px 20px; border-radius: var(--pill);
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--err); color: #fff; }

  /* Modal */
  .modal-back { position: fixed; inset: 0; background: rgba(6,10,20,.66); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
  .modal h3 { font-family:'Fraunces',serif; font-weight: 600; margin: 0 0 16px; font-size: 20px; }

  .pagination { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 14px; color: var(--muted); font-size: 13px; }

  /* Responsive */
  .hamburger { display: none; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; }
    aside { position: fixed; z-index: 30; width: min(84vw, var(--sidebar)); transform: translateX(-100%);
      transition: transform .22s ease; box-shadow: var(--shadow); }
    aside.open { transform: translateX(0); }
    .topbar { display: flex; }
    .hamburger { display: inline-flex; }
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 25; }
    .content { padding: 20px 16px 90px; }
    .page-head h1 { font-size: 23px; }
  }
</style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login">
    <form class="login-card" onsubmit="event.preventDefault(); login();">
      <div class="brand wordmark">Stylo<span class="ai">AI</span></div>
      <div class="eyebrow">Studio · Admin Control Center</div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="admin@stylo.app" />
      <label for="password" style="margin-top:14px">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="full" style="width:100%; margin-top:20px" type="submit">Sign in</button>
      <div class="err-text" id="loginErr"></div>
    </form>
  </div>

  <!-- SHELL -->
  <div id="app" class="hidden">
    <div id="scrim" class="hidden" onclick="toggleSidebar(false)"></div>
    <aside id="sidebar">
      <div class="side-brand">
        <img class="side-logo" src="/admin/logo.png" onerror="this.style.display='none'" alt="" />
        <span class="wordmark">Stylo<span class="ai">AI</span></span>
      </div>
      <nav class="side-nav" id="nav"></nav>
      <div class="side-foot">
        <div class="who" id="whoami"></div>
        <button class="ghost" style="width:100%" onclick="logout()">Log out</button>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <button class="ghost hamburger icon" onclick="toggleSidebar(true)">☰</button>
        <span class="wordmark" style="font-size:18px">Stylo<span class="ai">AI</span> <span class="muted" style="font-family:Inter;font-size:13px">Studio</span></span>
      </div>
      <div class="content" id="view"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

<script>
const API = location.origin + '/v1';
let TOKEN = localStorage.getItem('stylo_admin_token') || '';
let ADMIN = JSON.parse(localStorage.getItem('stylo_admin') || 'null');

// Sidebar: only pages backed by real API functionality.
const NAV = [
  { group: null, items: [ ['Dashboard','◧'] ] },
  { group: 'Content', items: [ ['Trending Styles','✦'], ['Poses','⛹'], ['Categories','▦'] ] },
  { group: 'People & activity', items: [ ['Users','◍'], ['Generations','❖'], ['Credits','◈'] ] },
  { group: 'System', items: [ ['Settings','⚙'], ['System Health','♥'] ] },
];
let currentTab = 'Dashboard';

// The five user-facing STYLE categories (Pose is a separate, free type; the old
// "inspiration" category is retired). These drive the Trending Styles selectors.
const SECTIONS = ['outfit','hair','glasses','accessories','ai_edit'];
const SECTION_LABELS = { outfit:'Outfit', hair:'Hair', glasses:'Glasses', accessories:'Accessories', ai_edit:'AI Edit' };
const GEN_STATUSES = ['queued','processing','succeeded','failed','refunded'];
const GEN_TYPES = ['outfit','hair','glasses','accessories','pose','ai_edit'];
const TXN_TYPES = ['signup_bonus','admin_grant','purchase','generation_hold','generation_settle','generation_refund','promo'];

/* ---------- helpers ---------- */
function esc(s){ return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg, isErr){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(isErr?' err':''); setTimeout(()=>t.className='toast',2000); }
function fmtDate(x){ if(!x) return '—'; const d=new Date(x); return isNaN(d)?'—':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTime(x){ if(!x) return '—'; const d=new Date(x); return isNaN(d)?'—':d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
const view = () => document.getElementById('view');
function loadingHTML(msg){ return `<div class="state"><div class="spinner"></div><div class="t">${esc(msg||'Loading…')}</div></div>`; }
function emptyHTML(ico,t,s){ return `<div class="state"><div class="ico">${ico||'∅'}</div><div class="t">${esc(t)}</div>${s?`<div class="s">${esc(s)}</div>`:''}</div>`; }
function errorHTML(msg,retry){ return `<div class="state"><div class="ico">⚠</div><div class="t">Something went wrong</div><div class="s">${esc(msg)}</div>${retry?`<div style="margin-top:16px"><button class="secondary" onclick="${retry}">Try again</button></div>`:''}</div>`; }
function statusPill(s){ const ok=['succeeded','committed','granted','active','verified'],warn=['queued','processing','pending'],err=['failed','reversed','invalid','suspended','deleted','refunded'];
  const c = ok.includes(s)?'ok':warn.includes(s)?'warn':err.includes(s)?'err':'neutral'; return `<span class="pill ${c}">${esc(s)}</span>`; }

async function api(path, opts={}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', ...(TOKEN?{Authorization:'Bearer '+TOKEN}:{}), ...(opts.headers||{}) },
  });
  if (res.status === 401) { logout(); throw new Error('Session expired — please sign in again.'); }
  const body = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(body?.error?.message || ('Request failed ('+res.status+')'));
  return body;
}

/* ---------- auth ---------- */
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('loginErr'); errEl.textContent='';
  try {
    const r = await api('/admin/auth/login', { method:'POST', body: JSON.stringify({ email, password }) });
    TOKEN = r.access_token; ADMIN = r.admin;
    localStorage.setItem('stylo_admin_token', TOKEN);
    localStorage.setItem('stylo_admin', JSON.stringify(ADMIN));
    boot();
  } catch(e) { errEl.textContent = e.message; }
}
function logout(){ TOKEN=''; ADMIN=null; localStorage.removeItem('stylo_admin_token'); localStorage.removeItem('stylo_admin');
  document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); }

function toggleSidebar(open){
  const sb=document.getElementById('sidebar'), sc=document.getElementById('scrim');
  if(open){ sb.classList.add('open'); sc.classList.remove('hidden'); }
  else { sb.classList.remove('open'); sc.classList.add('hidden'); }
}

function boot(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('whoami').textContent = ADMIN ? (ADMIN.email + ' · ' + ADMIN.role) : '';
  const nav = document.getElementById('nav'); nav.innerHTML='';
  NAV.forEach(sec=>{
    if(sec.group){ const g=document.createElement('div'); g.className='nav-group'; g.textContent=sec.group; nav.appendChild(g); }
    sec.items.forEach(([name,ico])=>{
      const b=document.createElement('button'); b.className='nav-item'+(name===currentTab?' active':'');
      b.innerHTML=`<span class="ico">${ico}</span><span>${name}</span>`;
      b.onclick=()=>{ currentTab=name; toggleSidebar(false); boot(); };
      nav.appendChild(b);
    });
  });
  render();
}

async function render(){
  const v = view(); v.innerHTML = loadingHTML();
  const map = { 'Dashboard':renderDashboard, 'Trending Styles':renderTrending, 'Poses':renderPoses,
    'Categories':renderCategories, 'Users':renderUsers, 'Generations':renderGenerations, 'Credits':renderTransactions,
    'Settings':renderSettings, 'System Health':renderHealth };
  const fn = map[currentTab] || renderDashboard;
  try { await fn(v); }
  catch(e){ v.innerHTML = errorHTML(e.message, 'render()'); }
}

/* ---------- Dashboard ---------- */
async function renderDashboard(v){
  const s = await api('/admin/stats');
  const g = s.generations || {};
  const stat = (n,l,accent)=>`<div class="stat${accent?' accent':''}"><div class="n">${n??0}</div><div class="l">${l}</div></div>`;
  const types = s.generations_by_type||[];
  const max = Math.max(1, ...types.map(t=>t.count));
  const bars = types.length ? types.map(t=>`<div class="bar-row"><span class="muted" style="font-size:13px">${esc(t.type)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(t.count/max*100)}%"></div></div>
      <span style="text-align:right;font-weight:600">${t.count}</span></div>`).join('') : emptyHTML('❖','No generations yet','Activity appears here as users create looks.');
  const recent = (s.recent_users||[]);
  const recentRows = recent.length ? recent.map(u=>`<tr>
      <td><strong>${esc(u.display_name||'—')}</strong><div class="sub">${esc(u.email||'')}</div></td>
      <td>${statusPill(u.status)}</td><td>${u.balance}</td><td class="muted">${fmtDate(u.created_at)}</td></tr>`).join('')
    : '<tr><td colspan="4"><div class="state" style="padding:26px"><div class="t">No signups yet</div></div></td></tr>';

  v.innerHTML = `
    <div class="page-head"><div class="eyebrow">Overview</div><h1>Dashboard</h1><p>Live metrics from the production database.</p></div>
    <div class="stat-grid">
      ${stat(s.users,'Total users')}
      ${stat(s.active_users,'Active (30d)', true)}
      ${stat(s.recent_signups,'New (7d)')}
      ${stat(g.total,'Generations')}
      ${stat(g.succeeded,'Succeeded')}
      ${stat(g.failed,'Failed')}
      ${stat(g.in_progress,'In progress')}
      ${stat(s.credits_used,'Credits used', true)}
      ${stat(s.purchases_granted,'Purchases')}
    </div>
    <div class="section-title">Generations by type</div>
    <div class="card">${bars}</div>
    <div class="section-title">Recent signups</div>
    <div class="table-wrap"><table><thead><tr><th>User</th><th>Status</th><th>Credits</th><th>Joined</th></tr></thead>
      <tbody>${recentRows}</tbody></table></div>`;
}

/* ---------- Trending ---------- */
let trendFilter = '';
async function renderTrending(v){
  const q = trendFilter ? '?section='+encodeURIComponent(trendFilter) : '';
  const items = await api('/admin/trending'+q);
  const secOpts = ['<option value="">All categories</option>'].concat(SECTIONS.map(s=>`<option value="${s}" ${s===trendFilter?'selected':''}>${SECTION_LABELS[s]}</option>`)).join('');
  const priceLabel = (p)=> p==null ? '<span class="muted">default</span>' : (p===0 ? '<span class="pill ok">free</span>' : ('<span class="gold">'+p+'</span>'));
  const tagChips = (t)=> (t&&t.length) ? t.slice(0,4).map(x=>`<span class="pill neutral" style="margin:1px">${esc(x)}</span>`).join('') : '<span class="muted">—</span>';
  const rows = items.map((i)=>`<tr>
    <td><img class="thumb" src="${esc(i.image_url)}" onerror="this.style.opacity=.25" alt=""/></td>
    <td><strong>${esc(i.title)}</strong><div class="sub">${esc(i.description||i.subtitle||'')}</div></td>
    <td><span class="pill neutral">${esc(SECTION_LABELS[i.section]||i.section)}</span></td>
    <td>${tagChips(i.tags)}</td>
    <td>${priceLabel(i.creditPrice)}</td>
    <td>${i.isTrending?'<span class="pill ok">★ trending</span>':'<span class="muted">—</span>'}</td>
    <td>${i.isActive?'<span class="pill ok">active</span>':'<span class="pill err">hidden</span>'}</td>
    <td class="muted">${i.position??0}</td>
    <td><div class="btn-row">

function parseTags(s){ return (s||'').split(',').map(x=>x.trim()).filter(Boolean); }
function priceOrNull(s){ const t=(s||'').trim(); if(t==='') return null; const n=parseInt(t,10); return isNaN(n)?null:Math.max(0,n); }
async function uploadImage(file){
  // Basic client-side validation before requesting a presigned URL.
  const ALLOWED = ['image/jpeg','image/png','image/webp'];
  if(!ALLOWED.includes(file.type)) throw new Error('Unsupported image type ('+(file.type||'unknown')+'). Use JPG, PNG or WEBP.');
  if(file.size > 12*1024*1024) throw new Error('Image is too large ('+(file.size/1048576).toFixed(1)+'MB). Max 12MB.');
  const p = await api('/admin/media/presign', { method:'POST', body: JSON.stringify({ content_type: file.type }) });
  let put;
  try {
    put = await fetch(p.upload_url, { method:'PUT', headers:{'Content-Type':file.type}, body:file });
  } catch (e) {
    // A thrown fetch here is almost always a browser CORS rejection on the S3
    // PUT — the bucket must allow PUT from this admin origin. Surface it clearly.
    throw new Error('Upload to storage was blocked by the browser (likely S3 CORS). The S3 bucket must allow PUT from '+location.origin+'. Ask an admin to add a CORS rule.');
  }
  if(!put.ok){
    const detail = await put.text().catch(()=> '');
    throw new Error('Image upload failed ('+put.status+'). '+(detail? detail.slice(0,140):'Check S3 permissions/CORS.'));
  }
  return p.s3_key;
}
async function createTrending(){

    if(!title){ throw new Error('Please enter a title.'); }
    if(!file){ throw new Error('Please choose an image.'); }
    const key = await uploadImage(file);
    const price = priceOrNull(document.getElementById('c_price').value);
    await api('/admin/trending', { method:'POST', body: JSON.stringify({
      section: document.getElementById('c_section').value,
      title,
      subtitle: document.getElementById('c_subtitle').value || undefined,
      description: document.getElementById('c_desc').value || undefined,
      tags: parseTags(document.getElementById('c_tags').value),
      preset_key: document.getElementById('c_preset').value || undefined,
      ...(price!=null ? { credit_price: price } : {}),
      is_trending: document.getElementById('c_trending').checked,
      position: parseInt(document.getElementById('c_position').value,10) || 0,
      image_s3_key: key,
    })});

  } catch(e){ err.textContent = e.message; }

      </div><div class="err-text" id="g_err"></div></div>
      <div class="section-title">Transactions</div>
      <div class="table-wrap"><table><thead><tr><th>Amount</th><th>Type</th><th>Status</th><th>Note</th><th>When</th></tr></thead>
        <tbody>${txns||'<tr><td colspan="5"><div class="state" style="padding:24px"><div class="t">No transactions</div></div></td></tr>'}</tbody></table></div>
      <div class="section-title">Recent generations</div>
      <div class="table-wrap"><table><thead><tr><th>Type</th><th>Status</th><th>Cost</th><th>When</th></tr></thead>
        <tbody>${gens||'<tr><td colspan="4"><div class="state" style="padding:24px"><div class="t">No generations</div></div></td></tr>'}</tbody></table></div>`;
  } catch(e){ el.innerHTML = errorHTML(e.message, 'searchUsers()'); }
}
async function grant(id){ const err=document.getElementById('g_err'); err.textContent='';
  try{ const amount=parseInt(document.getElementById('g_amt').value,10); if(!amount||amount<1) throw new Error('Enter a positive amount.');
    const note=document.getElementById('g_note').value;
    const r=await api('/admin/users/'+id+'/credits',{method:'POST',body:JSON.stringify({amount,note})});
    toast('Granted · new balance '+r.balance); viewUser(id); }catch(e){ err.textContent=e.message; } }

/* ---------- Generations ---------- */
let genState = { status:'', type:'', offset:0, limit:25 };
async function renderGenerations(v){
  const p = new URLSearchParams(); if(genState.status)p.set('status',genState.status); if(genState.type)p.set('type',genState.type);
  p.set('limit',genState.limit); p.set('offset',genState.offset);
  const r = await api('/admin/generations?'+p.toString());
  const rows = r.items.map(g=>`<tr>
    <td>${esc(g.user_name||'—')}<div class="sub">${esc(g.user_email||'')}</div></td>
    <td><span class="pill neutral">${esc(g.type)}</span></td>
    <td class="muted">${esc(g.mode)}</td>
    <td>${statusPill(g.status)}</td>
    <td>${g.credit_cost}</td>
    <td class="muted">${g.error_code?('<span class="pill err">'+esc(g.error_code)+'</span>'):'—'}</td>
    <td class="muted">${fmtDateTime(g.created_at)}</td></tr>`).join('');
  const statusOpts = ['<option value="">All statuses</option>'].concat(GEN_STATUSES.map(s=>`<option ${s===genState.status?'selected':''}>${s}</option>`)).join('');
  const typeOpts = ['<option value="">All types</option>'].concat(GEN_TYPES.map(s=>`<option ${s===genState.type?'selected':''}>${s}</option>`)).join('');
  v.innerHTML = `
    <div class="page-head"><div class="eyebrow">Activity</div><h1>Generations</h1><p>Global AI generation activity across all users (read-only).</p></div>
    <div class="wrap" style="margin-bottom:14px">
      <div style="max-width:200px"><label>Status</label><select onchange="genState.status=this.value;genState.offset=0;render()">${statusOpts}</select></div>
      <div style="max-width:200px"><label>Type</label><select onchange="genState.type=this.value;genState.offset=0;render()">${typeOpts}</select></div>
    </div>
    ${r.items.length ? `<div class="table-wrap"><table>
      <thead><tr><th>User</th><th>Type</th><th>Mode</th><th>Status</th><th>Cost</th><th>Error</th><th>Created</th></tr></thead>
      <tbody>${rows}</tbody></table></div>${pager(r,'genState')}` : emptyHTML('❖','No generations found','Nothing matches the current filters.')}`;
}

/* ---------- Transactions ---------- */
let txnState = { type:'', offset:0, limit:25 };
async function renderTransactions(v){
  const p = new URLSearchParams(); if(txnState.type)p.set('type',txnState.type);
  p.set('limit',txnState.limit); p.set('offset',txnState.offset);
  const r = await api('/admin/transactions?'+p.toString());
  const rows = r.items.map(t=>`<tr>
    <td>${esc(t.user_name||'—')}<div class="sub">${esc(t.user_email||'')}</div></td>
    <td style="font-weight:600;color:${t.amount>=0?'var(--ok)':'var(--err)'}">${t.amount>0?'+':''}${t.amount}</td>
    <td>${t.balance_after}</td>
    <td><span class="pill neutral">${esc(t.type)}</span></td>
    <td>${statusPill(t.status)}</td>
    <td class="muted">${esc(t.note||'—')}</td>
    <td class="muted">${fmtDateTime(t.created_at)}</td></tr>`).join('');
  const typeOpts = ['<option value="">All types</option>'].concat(TXN_TYPES.map(s=>`<option ${s===txnState.type?'selected':''}>${s}</option>`)).join('');
  v.innerHTML = `
    <div class="page-head"><div class="eyebrow">Activity</div><h1>Credits & Transactions</h1><p>The append-only credit ledger across all users (read-only).</p></div>
    <div class="wrap" style="margin-bottom:14px"><div style="max-width:220px"><label>Transaction type</label>
      <select onchange="txnState.type=this.value;txnState.offset=0;render()">${typeOpts}</select></div></div>
    ${r.items.length ? `<div class="table-wrap"><table>
      <thead><tr><th>User</th><th>Amount</th><th>Balance</th><th>Type</th><th>Status</th><th>Note</th><th>When</th></tr></thead>
      <tbody>${rows}</tbody></table></div>${pager(r,'txnState')}` : emptyHTML('◈','No transactions found','Nothing matches the current filters.')}`;
}

function pager(r, stateName){
  const from = r.total===0?0:r.offset+1, to = Math.min(r.offset+r.limit, r.total);
  const prevD = r.offset<=0, nextD = r.offset+r.limit>=r.total;
  return `<div class="pagination">
    <span>${from}–${to} of ${r.total}</span>
    <button class="secondary icon" ${prevD?'disabled':''} onclick="${stateName}.offset=Math.max(0,${stateName}.offset-${stateName}.limit);render()">← Prev</button>
    <button class="secondary icon" ${nextD?'disabled':''} onclick="${stateName}.offset=${stateName}.offset+${stateName}.limit;render()">Next →</button>
  </div>`;
}

/* ---------- Settings ---------- */
async function renderSettings(v){
  const rows = await api('/admin/settings');
  v.innerHTML = `
    <div class="page-head"><div class="eyebrow">System</div><h1>Settings</h1><p>Credit costs and feature flags. The app reads these from <code>/config</code> — edits apply immediately.</p></div>
    ${rows.length ? rows.map(s=>`<div class="card" style="margin-bottom:14px">
      <div class="flex"><strong>${esc(s.key)}</strong><div class="spacer"></div><button class="secondary" onclick='saveSetting(${JSON.stringify(s.key)})'>Save</button></div>
      ${s.description?`<p class="muted" style="margin:6px 0">${esc(s.description)}</p>`:''}
      <textarea id="set_${cssId(s.key)}" rows="6" style="font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;margin-top:8px">${esc(JSON.stringify(s.value,null,2))}</textarea>
      <div class="err-text" id="err_${cssId(s.key)}"></div></div>`).join('')
    : emptyHTML('⚙','No settings defined','System settings will appear here when configured.')}`;
}
function cssId(k){ return k.replace(/[^a-zA-Z0-9_-]/g,'_'); }
async function saveSetting(key){ const id=cssId(key); const err=document.getElementById('err_'+id); err.textContent='';
  try{ const value=JSON.parse(document.getElementById('set_'+id).value);
    await api('/admin/settings/'+encodeURIComponent(key),{method:'PUT',body:JSON.stringify({value})}); toast('Saved '+key);
  }catch(e){ err.textContent = e.message.includes('JSON')?'Invalid JSON — check the syntax.':e.message; } }

/* ---------- System Health ---------- */
async function renderHealth(v){
  v.innerHTML = `
    <div class="page-head"><div class="eyebrow">System</div><h1>System Health</h1><p>Live status of the production API, database, and authentication. No secrets are shown.</p></div>
    <div id="health_body">${loadingHTML('Checking services…')}</div>`;
  const body = document.getElementById('health_body');
  const row = (label, ok, detail)=>`<div class="card" style="margin-bottom:12px"><div class="flex">
    <span class="pill ${ok?'ok':'err'}">${ok?'●  Healthy':'●  Down'}</span>
    <div><strong style="margin-left:6px">${esc(label)}</strong><div class="muted" style="font-size:12.5px">${esc(detail)}</div></div></div></div>`;
  try {
    // These endpoints are intentionally public and expose no secrets.
    const [health, fb, gen] = await Promise.all([
      fetch(API+'/health').then(r=>r.json()).catch(()=>null),
      fetch(API+'/auth/firebase-status').then(r=>r.json()).catch(()=>null),
      fetch(API+'/gen-health').then(r=>r.json()).catch(()=>null),
    ]);
    let html = '';
    html += row('API', !!health, health ? ('HTTPS · '+location.host) : 'Unreachable');
    html += row('Database', health && health.db==='ok', health ? ('PostgreSQL · '+(health.db||'unknown')) : 'Unknown');
    html += row('Firebase Admin', !!(fb && fb.configured), fb && fb.configured ? ('Configured · project '+esc(fb.project_id||'—')) : 'Not configured');
    html += row('AI provider', !!(gen && gen.provider_configured), gen ? ((gen.provider_configured?'Configured':'NOT configured')+' · '+esc(gen.provider||'?')+' · model '+esc(gen.model||'—')) : 'Unknown');
    html += row('Generation queue', !!(gen && gen.queue_reachable), gen ? (gen.queue_reachable?('Reachable · '+JSON.stringify(gen.job_counts||{})):'Redis unreachable — generations will not process') : 'Unknown');
    html += `<div class="card"><div class="muted" style="font-size:12.5px">Last checked ${new Date().toLocaleTimeString()} · <a href="#" onclick="event.preventDefault();renderHealth(view())">Refresh</a></div></div>`;
    body.innerHTML = html;
  } catch(e){ body.innerHTML = errorHTML(e.message, 'renderHealth(view())'); }
}

/* ---------- Modal ---------- */
function openModal(html){ let m=document.getElementById('modal'); if(!m){ m=document.createElement('div'); m.id='modal'; document.body.appendChild(m); }
  m.className='modal-back'; m.innerHTML=`<div class="modal" onclick="event.stopPropagation()">${html}</div>`; m.onclick=closeModal; }
function closeModal(){ const m=document.getElementById('modal'); if(m){ m.className='hidden'; m.innerHTML=''; } }

/* ---------- boot ---------- */
if (TOKEN) { api('/admin/stats').then(boot).catch(()=>logout()); }
</script>
</body>
