name: styloai
description: StyloAI — Your AI Personal Stylist.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Auth & messaging (configured by the developer — see docs/ENVIRONMENT.md)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_messaging: ^15.0.4
  google_sign_in: ^6.2.1

  # Billing
  in_app_purchase: ^3.2.0

  # Media & storage
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  http: ^1.2.1

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
